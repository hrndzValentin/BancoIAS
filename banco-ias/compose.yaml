services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=bancoias'
      - 'POSTGRES_USER=bancoias'
      - 'POSTGRES_PASSWORD=bancoias'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bancoias -d bancoias']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
